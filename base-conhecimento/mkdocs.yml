site_name: Base de Conhecimento da Agência
site_description: Documentação interna da agência
site_author: Equipe da Agência
docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang:
        - pt
        - en
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Início: index.md
  - Serviços:
      - servicos/index.md
      - Site / Landing Page: servicos/site-landing-page.md
      - Google Business Profile: servicos/google-business-profile.md
      - Tráfego Pago:
          - servicos/trafego-pago/index.md
          - Meta Ads: servicos/trafego-pago/meta-ads.md
          - Google Ads: servicos/trafego-pago/google-ads.md
          - Local Service Ads: servicos/trafego-pago/local-service-ads.md
      - Funil de Vendas: servicos/funil-de-vendas.md
      - Sistemas e Automações: servicos/sistemas/index.md
      - Consultorias: servicos/consultorias.md
  - Processos Internos:
      - processos/index.md
  - Clientes e Cases:
      - clientes/index.md
  - Recursos:
      - recursos/index.md

extra:
  generator: false

copyright: Copyright &copy; 2026 - Sua Agência
